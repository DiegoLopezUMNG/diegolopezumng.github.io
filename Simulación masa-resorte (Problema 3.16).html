<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulación masa-resorte</title>
<style>
/* ===== 1. ESTILO: colores como "tokens" para tema claro/oscuro ===== */
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--ln:#d8d8d2;--c1:#2a6fdb;--c2:#d9480f;--card:#fff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ecece8;--mut:#9a9a94;--ln:#3a3a36;--c1:#6ea8ff;--c2:#ff9a5c;--card:#222220}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ecece8;--mut:#9a9a94;--ln:#3a3a36;--c1:#6ea8ff;--c2:#ff9a5c;--card:#222220}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px}
.wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:10px;flex:1 1 320px;min-width:0}
canvas{max-width:100%;height:auto;display:block}
.row{display:flex;flex-direction:column;font-size:13px}
.row label{color:var(--mut)} .row b{color:var(--fg)}
#ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px}
button{font:inherit;font-size:13px;padding:5px 10px;margin:3px 4px 0 0;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer}
#info{font-size:13px;line-height:1.6}
</style>
</head>
<body>
<h1>Simulación masa-resorte: m·x'' + γ·x' + k·x = F·cos(ωt)</h1>
<p class="sub">Con F = 0 es el Problema 3.16. Con F &gt; 0 aparecen pulsaciones y resonancia. Convención: x positivo hacia abajo.</p>

<div class="card" style="margin-bottom:10px">
  <div id="pre"></div>               <!-- botones de ejemplos -->
  <div id="ctl" style="margin-top:8px"></div> <!-- sliders (se crean con JS) -->
</div>

<div class="wrap">
  <div class="card"><canvas id="cvMass" width="260" height="360"></canvas></div>
  <div class="col">
    <div class="card"><canvas id="cvTime" width="560" height="240"></canvas></div>
    <div class="card"><canvas id="cvPhase" width="560" height="240"></canvas></div>
    <div class="card" id="info"></div>
  </div>
</div>

<script>
/* ===== 2. DATOS: parámetros del modelo (valores iniciales = Ejercicio 3.16 b) ===== */
const $ = id => document.getElementById(id);   // atajo para buscar elementos
const P = {m:1, g:10, k:16, x0:3, v0:0, F:0, w:0, sp:1}; // g = γ (amortiguamiento), w = ω, sp = velocidad
// Definición de sliders: [clave, texto, mínimo, máximo, paso]
const DEF = [['m','Masa m',0.5,5,0.1],['g','Amortiguamiento γ',0,12,0.1],['k','Constante k',1,40,1],
  ['x0','x(0)',-5,5,0.1],['v0',"x'(0) = v₀",-40,40,1],['F','Fuerza F',0,5,0.1],
  ['w','Frecuencia ω',0,10,0.1],['sp','Velocidad ×',0.2,3,0.1]];
// Ejemplos listos (cada uno cambia varios parámetros a la vez)
const PRE = {
  'Ej. 3.16 (b): v₀=0'   :{m:1,g:10,k:16,x0:3,v0:0,F:0,w:0,sp:1},
  'Ej. 3.16 (c): v₀=−25' :{m:1,g:10,k:16,x0:3,v0:-25,F:0,w:0,sp:1},
  'Ej. 3.16 (d): v₀=−30' :{m:1,g:10,k:16,x0:3,v0:-30,F:0,w:0,sp:1},
  'Subamortiguado'       :{m:1,g:1,k:16,x0:3,v0:0,F:0,w:0,sp:1},
  'Pulsaciones'          :{m:1,g:0,k:16,x0:0,v0:0,F:2,w:3.6,sp:3},
  'Resonancia'           :{m:1,g:0,k:16,x0:0,v0:0,F:2,w:4,sp:3},
  'Resonancia con γ'     :{m:1,g:1,k:16,x0:0,v0:0,F:2,w:4,sp:3}
};

/* ===== 3. FÍSICA: integración numérica (Runge-Kutta 4) ===== */
// Despejamos x'' de la ecuación: x'' = (F cos(ωt) − γ x' − k x) / m
const acc = (t,x,v) => (P.F*Math.cos(P.w*t) - P.g*v - P.k*x) / P.m;
// Estado de la simulación: tiempo, posición, velocidad, historial y datos para escalar gráficas
const S = {t:0,x:0,v:0,hist:[],n:0,ym:1,vm:1,run:true,cnt:0};

function reset(){                       // vuelve a las condiciones iniciales
  S.t=0; S.x=P.x0; S.v=P.v0; S.n=0; S.cnt=0;
  S.hist=[[0,S.x,S.v]];
  S.ym=Math.max(1,Math.abs(P.x0)*1.1);  // rango vertical de las gráficas
  S.vm=Math.max(1,Math.abs(P.v0)*1.1);
}
function rk4(h){                        // un paso de tamaño h (4 pendientes ponderadas)
  const {t,x,v}=S;
  const a1=acc(t,x,v);                                    // pendiente al inicio
  const x2=x+h/2*v,  v2=v+h/2*a1, a2=acc(t+h/2,x2,v2);    // a la mitad (1ª estimación)
  const x3=x+h/2*v2, v3=v+h/2*a2, a3=acc(t+h/2,x3,v3);    // a la mitad (2ª estimación)
  const x4=x+h*v3,   v4=v+h*a3,   a4=acc(t+h,x4,v4);      // al final
  const xPrev=S.x;
  S.x = x + h/6*(v + 2*v2 + 2*v3 + v4);                   // nueva posición
  S.v = v + h/6*(a1 + 2*a2 + 2*a3 + a4);                  // nueva velocidad
  S.t = t + h;
  if(xPrev*S.x<0) S.n++;                                  // cambio de signo = cruce por equilibrio
  S.ym=Math.max(S.ym,Math.abs(S.x)*1.1); S.vm=Math.max(S.vm,Math.abs(S.v)*1.1);
  if(++S.cnt%5===0) S.hist.push([S.t,S.x,S.v]);           // guardamos 1 de cada 5 pasos
}

/* ===== 4. DIBUJO ===== */
const col = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawMass(){                    // animación: techo, resorte, masa y flecha de fuerza
  const c=$('cvMass'), g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const cx=W/2, y0=190, sc=140/S.ym;    // y0 = altura del equilibrio; sc = píxeles por unidad
  const ym=y0+S.x*sc;                   // centro de la masa (x>0 baja)
  g.strokeStyle=col('--mut'); g.lineWidth=3;
  g.beginPath(); g.moveTo(cx-60,18); g.lineTo(cx+60,18); g.stroke();       // techo
  g.setLineDash([5,4]); g.lineWidth=1; g.strokeStyle=col('--c2');
  g.beginPath(); g.moveTo(20,y0); g.lineTo(W-20,y0); g.stroke(); g.setLineDash([]); // equilibrio
  g.fillStyle=col('--c2'); g.font='12px system-ui'; g.fillText('equilibrio (x=0)',22,y0-6);
  g.strokeStyle=col('--fg'); g.lineWidth=2; g.beginPath(); g.moveTo(cx,18);       // resorte en zigzag
  const y2=ym-16, n=10;
  for(let i=1;i<=n;i++) g.lineTo(cx+(i%2?14:-14), 18+(y2-18)*i/(n+1));
  g.lineTo(cx,y2); g.stroke();
  g.fillStyle=col('--c1'); g.fillRect(cx-24,ym-16,48,32);                         // masa
  if(P.F>0){                            // flecha: fuerza externa F cos(ωt) (hacia abajo si es positiva)
    const f=P.F*Math.cos(P.w*S.t)/5*50, xa=cx+42;
    g.strokeStyle=col('--c2'); g.lineWidth=3; g.beginPath(); g.moveTo(xa,ym); g.lineTo(xa,ym+f); g.stroke();
    g.fillStyle=col('--c2'); g.fillText('F',xa+6,ym+4);
  }
}

function frame(g,W,H,title){            // marco con título; devuelve márgenes
  g.clearRect(0,0,W,H);
  g.strokeStyle=col('--ln'); g.lineWidth=1; g.strokeRect(44,22,W-54,H-48);
  g.fillStyle=col('--mut'); g.font='12px system-ui'; g.fillText(title,48,14);
}

function drawTime(){                    // gráfica x(t)
  const c=$('cvTime'), g=c.getContext('2d'), W=c.width, H=c.height;
  frame(g,W,H,'x(t)  —  posición vs tiempo');
  const L=44,R=10,T=22,B=26, tMax=Math.max(5,S.t*1.05), Y=S.ym;
  const px=t=>L+(W-L-R)*t/tMax, py=x=>T+(H-T-B)*(0.5-x/(2*Y));  // datos → píxeles
  g.setLineDash([4,4]); g.beginPath(); g.moveTo(L,py(0)); g.lineTo(W-R,py(0)); g.stroke(); g.setLineDash([]);
  g.fillStyle=col('--mut'); g.fillText('0',30,py(0)+4); g.fillText(Y.toFixed(1),8,T+10); g.fillText((-Y).toFixed(1),4,H-B-2);
  const st=tMax>20?5:tMax>10?2:1;       // separación de marcas en t
  for(let t=0;t<=tMax;t+=st) g.fillText(t,px(t)-4,H-10);
  g.strokeStyle=col('--c1'); g.lineWidth=2; g.beginPath();
  S.hist.forEach(([t,x],i)=>i?g.lineTo(px(t),py(x)):g.moveTo(px(t),py(x))); g.stroke();
  g.fillStyle=col('--c2'); g.beginPath(); g.arc(px(S.t),py(S.x),4,0,7); g.fill(); // punto actual
}

function drawPhase(){                   // plano de fase: x (horizontal) vs x' (vertical)
  const c=$('cvPhase'), g=c.getContext('2d'), W=c.width, H=c.height;
  frame(g,W,H,"Plano de fase  —  x' vs x");
  const L=44,R=10,T=22,B=26, X=S.ym, V=S.vm;
  const px=x=>L+(W-L-R)*(0.5+x/(2*X)), py=v=>T+(H-T-B)*(0.5-v/(2*V));
  g.strokeStyle=col('--ln'); g.beginPath();                      // ejes x=0 y x'=0
  g.moveTo(px(0),T); g.lineTo(px(0),H-B); g.moveTo(L,py(0)); g.lineTo(W-R,py(0)); g.stroke();
  g.strokeStyle=col('--c1'); g.lineWidth=2; g.beginPath();
  S.hist.forEach(([,x,v],i)=>i?g.lineTo(px(x),py(v)):g.moveTo(px(x),py(v))); g.stroke();
  g.fillStyle=col('--c2'); g.beginPath(); g.arc(px(S.x),py(S.v),4,0,7); g.fill();
  g.fillStyle=col('--mut'); g.fillText('x',W-18,py(0)-4); g.fillText("x'",px(0)+4,T+12);
}

function drawInfo(){                    // texto: régimen, raíces y fenómeno
  const {m,g,k,F,w}=P, w0=Math.sqrt(k/m), d=g*g-4*m*k;  // d = discriminante de la ecuación característica
  let reg, raíces;
  if(g===0){reg='sin amortiguamiento (oscilación pura)'; raíces=`r = ±${w0.toFixed(2)}i`;}
  else if(d>1e-9){const s=Math.sqrt(d); reg='sobreamortiguado (supercrítico): raíces reales distintas';
    raíces=`r₁ = ${((-g+s)/(2*m)).toFixed(3)},  r₂ = ${((-g-s)/(2*m)).toFixed(3)}`;}
  else if(d>=-1e-9){reg='críticamente amortiguado: raíz doble'; raíces=`r = ${(-g/(2*m)).toFixed(3)}`;}
  else{reg='subamortiguado: raíces complejas'; raíces=`r = ${(-g/(2*m)).toFixed(3)} ± ${(Math.sqrt(-d)/(2*m)).toFixed(3)}i`;}
  let fen='Vibración libre (F = 0): sólo solución homogénea.';
  if(F>0){
    if(g===0) fen=Math.abs(w-w0)<0.05?'RESONANCIA: la amplitud crece sin límite (≈ F·t/(2mω₀)).'
                                      :'Pulsaciones: dos frecuencias cercanas dan una envolvente lenta (si ω ≈ ω₀).';
    else fen=`Transitorio que decae + estado estacionario de amplitud R = ${(F/Math.sqrt((k-m*w*w)**2+(g*w)**2)).toFixed(3)}.`;
  }
  $('info').innerHTML=`<b>t</b> = ${S.t.toFixed(2)} s &nbsp; <b>x</b> = ${S.x.toFixed(3)} &nbsp; <b>x'</b> = ${S.v.toFixed(3)}<br>
  ω₀ = √(k/m) = ${w0.toFixed(3)} &nbsp; γ² − 4mk = ${d.toFixed(1)}<br>Régimen: ${reg}<br>Ecuación característica: ${raíces}<br>
  Cruces por el equilibrio: <b>${S.n}</b><br><b>Fenómeno:</b> ${fen}`;
}

/* ===== 5. CONTROL: sliders, botones y bucle de animación ===== */
function sync(){ for(const id in P){ $('s_'+id).value=P[id]; $('o_'+id).textContent=P[id]; } }
DEF.forEach(([id,txt,mn,mx,st])=>{      // crea un slider por parámetro
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<label>${txt}: <b id="o_${id}"></b></label><input type="range" id="s_${id}" min="${mn}" max="${mx}" step="${st}">`;
  $('ctl').appendChild(d);
  $('s_'+id).oninput=e=>{ P[id]=+e.target.value; sync(); if(id!=='sp') reset(); }; // cambiar parámetros reinicia
});
for(const nombre in PRE){               // un botón por ejemplo
  const b=document.createElement('button'); b.textContent=nombre;
  b.onclick=()=>{ Object.assign(P,PRE[nombre]); sync(); reset(); }; $('pre').appendChild(b);
}
const bp=document.createElement('button'); bp.textContent='⏯ Pausa';
bp.onclick=()=>{S.run=!S.run;}; $('pre').appendChild(bp);
const br=document.createElement('button'); br.textContent='↺ Reiniciar';
br.onclick=reset; $('pre').appendChild(br);

let last=0;
function loop(ts){                      // se ejecuta ~60 veces por segundo
  const dtReal=Math.min((ts-last)/1000,0.05); last=ts; // segundos reales (con tope)
  if(S.run && dtReal>0){
    const dtSim=dtReal*P.sp, pasos=Math.ceil(dtSim/0.002), h=dtSim/pasos; // pasos pequeños = más precisión
    for(let i=0;i<pasos;i++) rk4(h);
  }
  drawMass(); drawTime(); drawPhase(); drawInfo();
  requestAnimationFrame(loop);
}
sync(); reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
